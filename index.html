<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Live IPL Match</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: black;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* Particle container */
        #particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -1;
        }

        /* Video container */
        #video-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            height: 90vh;
            position: relative;
            padding-top: 12vh; /* Adjusted for balanced positioning */
            z-index: 1;
        }

        #live-stream {
            max-width: 80%;
            max-height: 70%;
        }

        .social-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            display: block;
            text-align: center;
            width: 200px;
            font-weight: bold;
        }
        #telegram-btn {
            background-color: #0088cc;
            color: white;
        }
        #instagram-btn {
            background-color: #e4405f;
            color: white;
            margin-top: 10px;
        }
        #help-btn {
            background-color: #ff9800;
            color: white;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Background Particle Effect -->
    <div id="particle-container"></div>

    <!-- Video Player -->
    <div id="video-container">
        <video id="live-stream" controls playsinline>
            <source id="video-source" src="https://starsporthindii.pages.dev/index.m3u8" type="application/x-mpegURL">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- Social Buttons -->
    <a id="telegram-btn" class="social-btn" href="https://t.me/+cS36n17L57syOTNl" target="_blank">Join Telegram Channel</a>
    <a id="instagram-btn" class="social-btn" href="https://www.instagram.com/j4tnx_?igsh=MTQ0Nm90d2ZoeW16Zw==" target="_blank">Follow Me on Instagram</a>
    <a id="help-btn" class="social-btn" href="https://t.me/j4tnx" target="_blank">For Any Help</a>

    <script>
        // Generate moving red particles
        function createParticles() {
            const container = document.getElementById("particle-container");

            for (let i = 0; i < 50; i++) {
                let particle = document.createElement("div");
                particle.classList.add("particle");
                particle.style.position = "absolute";
                particle.style.width = "5px";
                particle.style.height = "5px";
                particle.style.background = "red";
                particle.style.borderRadius = "50%";
                particle.style.top = Math.random() * window.innerHeight + "px";
                particle.style.left = Math.random() * window.innerWidth + "px";
                container.appendChild(particle);

                animateParticle(particle);
            }
        }

        // Animate particles in a continuous zig-zag motion
        function animateParticle(particle) {
            let directionX = Math.random() > 0.5 ? 1 : -1;
            let directionY = Math.random() > 0.5 ? 1 : -1;
            let speedX = Math.random() * 3 + 2;
            let speedY = Math.random() * 3 + 2;

            function moveParticle() {
                let leftPos = parseFloat(particle.style.left);
                let topPos = parseFloat(particle.style.top);

                particle.style.left = leftPos + speedX * directionX + "px";
                particle.style.top = topPos + speedY * directionY + "px";

                // Reverse direction when hitting screen boundaries
                if (leftPos > window.innerWidth || leftPos < 0) {
                    directionX *= -1;
                }
                if (topPos > window.innerHeight || topPos < 0) {
                    directionY *= -1;
                }

                requestAnimationFrame(moveParticle);
            }

            moveParticle();
        }

        // Initialize particles on page load
        window.onload = createParticles;

        // Hide social buttons when video is in full-screen mode
        document.getElementById("live-stream").addEventListener("fullscreenchange", function() {
            let telegramButton = document.getElementById("telegram-btn");
            let instagramButton = document.getElementById("instagram-btn");
            let helpButton = document.getElementById("help-btn");

            if (document.fullscreenElement) {
                telegramButton.style.display = "none";
                instagramButton.style.display = "none";
                helpButton.style.display = "none";
            } else {
                telegramButton.style.display = "block";
                instagramButton.style.display = "block";
                helpButton.style.display = "block";
            }
        });

    </script>

</body>
</html>
